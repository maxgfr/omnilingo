[package]
name = "omnilingo"
version = "2.17.3"
description = "Omnilingo — Language learning desktop app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "omnilingo_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }

[features]
default = []
mcp = ["tauri-plugin-mcp-bridge"]

# Security: tauri-plugin-updater 2.14.0 (latest on crates.io) depends on zip 4.x,
# affected by RUSTSEC-2026-0367 / RUSTSEC-2026-0368 / RUSTSEC-2026-0369 (fixed in zip >= 9).
# Upstream bumped zip to v9 on the v2 branch (tauri-apps/plugins-workspace#3698), which is
# 2.14.0 + that single change, but it is not published yet. Pin to that commit and drop this
# patch once tauri-plugin-updater >= 2.14.1 is released on crates.io.
[patch.crates-io]
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfadc4" }
